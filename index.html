<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For MY PASANDIDA MARD ❤️</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Inter font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Load Tone.js for sound effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        :root {
            --pink-light: #fce7f6; /* bg-pink-100 */
            --pink-accent: #f472b6; /* rose-400 */
            --navy-blue: #1e40af; /* blue-800 */
            --peach: #fdb99b; /* Custom peach tone */
            --red-heart: #ef4444; /* red-500 */
            --green: #10b981; /* green-500 */
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--pink-light);
            transition: background-color 0.5s;
            min-height: 100vh;
        }

        /* Glitter/Confetti Effect */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: var(--pink-accent);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            animation: fall 3s ease-in forwards;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        /* Floating Heart Effect */
        .heart-float {
            position: fixed;
            color: var(--red-heart);
            font-size: 20px;
            pointer-events: none;
            animation: float-up 5s linear forwards;
            opacity: 0;
            z-index: 50;
        }

        @keyframes float-up {
            0% { transform: translateY(0); opacity: 0.8; }
            50% { opacity: 1; }
            100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
        }

        /* Responsive Layout adjustments */
        .main-card {
            max-width: 90%;
            margin: 0 auto;
        }
        @media (min-width: 768px) {
            .main-card {
                max-width: 500px;
            }
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <!-- Welcome Modal (Layered over everything until dismissed) -->
    <div id="welcome-modal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-[100] transition-opacity duration-500">
        <div class="bg-white p-8 md:p-12 rounded-3xl text-center shadow-2xl border-4 border-red-500 max-w-sm mx-4 transition-transform duration-500">
            <h2 id="modal-title" class="text-3xl font-extrabold text-red-500 mb-4">A Special Surprise Just For You! 💌</h2>
            <p id="modal-message" class="text-xl text-navy-blue mb-6">Answer a few simple questions to collect compliments and cute pictures!</p>
            <button onclick="startQuiz()" 
                    class="bg-pink-accent hover:bg-rose-500 text-white font-bold py-3 px-8 rounded-full shadow-lg transition duration-300 transform hover:scale-105">
                Start The Quiz!
            </button>
        </div>
    </div>


    <!-- Main Application Card -->
    <div id="app-container" class="main-card bg-white p-6 md:p-10 rounded-3xl shadow-2xl border-4 border-rose-400/50 transition-all duration-500">

        <!-- Scoreboard -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-extrabold text-blue-800">My Quiz for You</h1>
            <div id="scoreboard" class="bg-indigo-600 text-white font-bold px-4 py-2 rounded-full shadow-lg flex items-center space-x-2 transition-all duration-500">
                <span class="text-xl">Score:</span>
                <span id="heart-score" class="text-2xl"></span>
            </div>
        </div>

        <!-- Question Panel -->
        <div id="question-panel" class="hidden">
            <p id="question-text" class="text-xl text-navy-blue mb-6 font-semibold"></p>
            <input type="text" id="user-answer" placeholder="Type your answer here..."
                   class="w-full p-3 mb-4 border-2 border-pink-400 rounded-xl focus:ring-2 focus:ring-rose-400 outline-none transition duration-150 text-gray-700">
            <button onclick="submitAnswer()" id="submit-btn"
                    class="w-full bg-rose-400 hover:bg-rose-500 text-white font-bold py-3 rounded-xl shadow-md transition duration-300 transform hover:scale-[1.01] flex items-center justify-center space-x-2">
                    <span>Submit and See My Message!</span>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
                      <path fill-rule="evenodd" d="M4.5 5.653c0-1.427 1.529-2.31 2.706-1.638L18 12l-10.795 7.985c-1.177.672-2.706-.207-2.706-1.638V5.653Z" clip-rule="evenodd" />
                    </svg>
            </button>
        </div>

        <!-- Compliment/Result Panel -->
        <div id="result-panel" class="hidden text-center transition-opacity duration-500">
            <h2 class="text-2xl font-extrabold text-green-600 mb-4 animate-bounce">CORRECT! (You win a compliment!)</h2>
            <p id="compliment-text" class="text-xl text-navy-blue whitespace-pre-wrap text-left mb-6 font-medium"></p>
            <div class="flex justify-center mb-6">
                <!-- Image URL is now set from the JavaScript object -->
                <img id="meme-image" class="w-full max-w-sm h-auto rounded-xl shadow-lg border-4 border-peach object-cover" alt="Cute Animal Picture" 
                     onerror="this.onerror=null; this.src='https://placehold.co/400x300/F472B6/ffffff?text=REWARD+IMAGE+ERROR';">
            </div>
            
            <!-- Navigation Buttons -->
            <div class="flex justify-center space-x-4">
                <!-- PREVIOUS BUTTON -->
                <button onclick="showPreviousCompliment()" id="prev-btn" disabled
                        class="px-6 bg-gray-400 hover:bg-gray-500 text-white font-bold py-3 rounded-xl shadow-md transition duration-300 transform hover:scale-[1.01] flex items-center justify-center space-x-2 disabled:opacity-50 disabled:cursor-not-allowed">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
                            <path fill-rule="evenodd" d="M10.5 3.792a.75.75 0 0 0-.71.144L3.84 8.167c-.208.192-.32.443-.32.698v5.91a.75.75 0 0 0 .32.698l5.95 4.231c.312.222.753.078.965-.234.212-.312.068-.753-.244-.965l-5.836-4.154h11.832a.75.75 0 0 0 0-1.5H4.664l5.836-4.154a.75.75 0 0 0 .244-.965.75.75 0 0 0-.965-.244Z" clip-rule="evenodd" />
                        </svg>
                        <span>Previous Compliment</span>
                </button>

                <!-- NEXT BUTTON -->
                <button onclick="goToNextPhase()" id="next-btn"
                        class="px-8 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-md transition duration-300 transform hover:scale-[1.01] flex items-center justify-center space-x-2">
                        <span>Next Compliment</span>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
                            <path fill-rule="evenodd" d="M3.75 12a.75.75 0 0 1 .75-.75h11.69l-2.22-2.22a.75.75 0 1 1 1.06-1.06l3.5 3.5a.75.75 0 0 1 0 1.06l-3.5 3.5a.75.75 0 1 1-1.06-1.06l2.22-2.22H4.5a.75.75 0 0 1-.75-.75Z" clip-rule="evenodd" />
                        </svg>
                </button>
            </div>
        </div>

        <!-- Love Letter Panel (Initially Hidden) -->
        <div id="love-letter-panel" class="hidden text-center py-8">
            <h2 class="text-4xl font-extrabold text-red-500 mb-6">A Letter For You ❤️</h2>
            <div class="bg-peach text-blue-800 p-6 rounded-2xl shadow-xl text-left">
                <p id="love-letter-content" class="whitespace-pre-wrap leading-relaxed text-lg"></p>
            </div>
            <p class="mt-8 text-xl font-bold text-pink-accent">Faithfully yours.</p>
        </div>

    </div>

    <script>
        const welcomeModal = document.getElementById('welcome-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        const scoreboard = document.getElementById('scoreboard');
        const heartScore = document.getElementById('heart-score');
        const questionPanel = document.getElementById('question-panel');
        const questionText = document.getElementById('question-text');
        const userAnswer = document.getElementById('user-answer');
        const submitBtn = document.getElementById('submit-btn');
        const resultPanel = document.getElementById('result-panel');
        const complimentText = document.getElementById('compliment-text');
        const memeImage = document.getElementById('meme-image');
        const nextBtn = document.getElementById('next-btn');
        const prevBtn = document.getElementById('prev-btn');
        const loveLetterPanel = document.getElementById('love-letter-panel');
        const loveLetterContent = document.getElementById('love-letter-content');

        let currentQuestionIndex = 0;
        let score = 0;
        const totalQuestions = 10;
        let synth = null; 

        // CORRECTED QUESTIONS, COMPLIMENTS, AND IMAGE contentFetchId PATHS
        const questions = [
            {
                q: "1. What is a synonym of “happy”?",
                answer: /joyful|cheerful|content|glad/i,
                compliment: "I swear you have this talent for making me grin at my phone like a total weirdo.\nIt’s honestly unfair how easily you get to me, even when you’re just texting.\nI keep trying not to overthink your messages… but fail every time.\nYou’re secretly dangerous, you know that?\nAnd I kinda like it.",
                memeUrl: "https://i.pinimg.com/736x/94/85/d9/9485d9554f2855826607af56a09a401c.jpg" 
            },
            {
                q: "2. What is the antonym of “optimistic”?",
                answer: /pessimistic|negative|cynical|gloomy/i,
                compliment: "You’re lowkey the best part of my day, even when I pretend I don’t care.\nI catch myself smiling at random times, just thinking about your texts.\nYou make ordinary things feel… way more fun.\nI don’t know how you do it, but you do.\nAnd I secretly hope you keep doing it.",
                memeUrl: "https://i.pinimg.com/736x/87/da/5d/87da5dce0f38b58f6c836a6e03dd005b.jpg" 
            },
            {
                q: "3. Define a metaphor.",
                answer: /figure|comparison|simile|speech/i,
                compliment: "Do you know how annoying it is that I can’t stop thinking about what you’ll text next?\nIt’s like you have this invisible pull on me.\nAnd I’m supposed to act normal? Impossible.\nYou’re way too good at this… and I’m completely falling for it.\nNot that I’m admitting it.",
                memeUrl: "https://i.pinimg.com/736x/df/3f/2b/df3f2be6daab17e1775b14a87cde8cc7.jpg" 
            },
            {
                q: "4. Give an example of a compound sentence.",
                answer: /and|but|or|so|yet/i,
                compliment: "Stop making your messages sound so effortless… it’s distracting.\nI literally catch myself rereading them just to smile again.\nDo you realize the power you have over me?\nIt’s dangerous, honestly.\nAnd I might just let you use it anyway.",
                memeUrl: "https://i.pinimg.com/736x/83/a3/1f/83a31f00db4902d54bab2a1624677a05.jpg" 
            },
            {
                q: "5. Name one Fundamental Right under the Indian Constitution.",
                answer: /equality|freedom|religion|exploitation|education|constitutional/i,
                compliment: "Your text means everything to me.\nI don’t know why, but I notice every little thing you say.\nAnd I can’t help grinning like a fool every time.\nYou’re basically a permanent highlight of my day.\nNot that I’m complaining.",
                memeUrl: "https://i.pinimg.com/736x/c5/1a/96/c51a960863c8a85840900b2ed8d5b092.jpg" 
            },
            {
                q: "6. What is the minimum age for Lok Sabha membership?",
                answer: /25|twenty-five|twenty five/i,
                compliment: "You have this way of making me feel special without even trying.\nIt’s so unfair how good you are at this… like, why are you allowed to be this perfect?\nEven your typing mistakes are kinda adorable.\nHonestly, texting with you is my favorite part of the day.\nDon’t ever change, okay?",
                memeUrl: "https://i.pinimg.com/1200x/6c/d9/f6/6cd9f64e42221f66319c190546e036ea.jpg" 
            },
            {
                q: "7. Who appoints the Chief Justice of India?",
                answer: /president|of india|government|rashtrapati/i,
                compliment: "Sometimes I think you might be secretly trying to mess with me.\nLike, how else do you explain the way I get butterflies reading your texts?\nIt’s unfair… you shouldn’t be allowed to have this effect on me.\nAnd yet… here I am, smiling like a fool.\nThanks for that, by the way.",
                memeUrl: "https://i.pinimg.com/1200x/7f/22/90/7f229056411ac16c0810f1d75457ece0.jpg" 
            },
            {
                q: "8. What is GDP?",
                answer: /domestic|product|output|economy|value/i,
                compliment: "I don’t know how you do it… studying so hard and still being this good.\nIt’s honestly impressive, and a little unfair.\nYou somehow manage to be smart and sweet at the same time.\nIt makes me wanna cheer for you even more.\nYou’re basically amazing, don’t let anyone tell you otherwise.",
                memeUrl: "https://i.pinimg.com/736x/5f/49/a2/5f49a2b2e1d73e76a9a35e93f967d5e3.jpg" 
            },
            {
                q: "9. Define inflation.",
                answer: /price|rise|currency|value|money|purchase/i,
                compliment: "Even when you’re busy studying for CDS, you somehow make time for being sweet.\nI notice the little things you do, and it honestly makes me melt.\nYou’re not allowed to be this thoughtful ; it’s dangerous.\nBut I’m not complaining… not one bit.\nYou make my day without even trying.",
                memeUrl: "https://i.pinimg.com/736x/6b/d9/38/6bd9380244288c8d5e59bbb6449ca655.jpg" 
            },
            {
                q: "10. What is the law of demand?",
                answer: /price|quantity|demand|inverse|decrease/i,
                compliment: "You’re literally the kind of person who makes brains look sexy.\nEvery message from you is like a little reminder of how good you are at being smart and flirty.\nI swear, it’s impossible not to notice.\nYou’ve got me hooked without even trying.\nAnd it’s terrifying… and adorable at the same time.",
                memeUrl: "https://i.pinimg.com/736x/a1/11/5c/a1115c6deaf50a1ee0e244c5e7915a23.jpg" 
            }
        ];

        const finalLetter = `My Chandan,

        You are officially the winner of this very silly, very important quiz. Not that there was any doubt; you always win in my book. And clearly, your brain is just as attractive as the rest of you! 😉

        Every question I asked was just a little excuse to tell you something you already know: you are incredibly loved. You make life feel like a constant adventure, even on the quietest days. You are brilliant, dedicated (especially with that CDS studying!), kind, funny, and the most thoughtful person I know.

        Thank you for being my best friend, my cutie, and my favorite person to annoy. I can't wait to see what beautiful things we do together next.

        All of me,
        Your Chandani`;

        /**
         * Tone.js setup to play a happy chime effect.
         */
        function playComplimentChime() {
            if (!synth) {
                synth = new Tone.PolySynth(Tone.AMSynth).toDestination();
                synth.set({
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.01, decay: 0.2, sustain: 0, release: 0.5 }
                });
            }
            synth.triggerAttackRelease(["C5", "E5"], "8n");
        }


        // --- Local Storage Management ---

        function saveProgress() {
            try {
                const progress = {
                    score: score,
                    index: currentQuestionIndex
                };
                localStorage.setItem('quizProgress', JSON.stringify(progress));
            } catch (error) {
                console.error("Could not save progress:", error);
            }
        }

        function loadProgress() {
            try {
                const savedProgress = localStorage.getItem('quizProgress');
                if (savedProgress) {
                    const progress = JSON.parse(savedProgress);
                    score = progress.score;
                    currentQuestionIndex = progress.index;
                    
                    if (currentQuestionIndex > 0 && currentQuestionIndex < totalQuestions) {
                        // Resume in progress
                        modalTitle.textContent = "Welcome Back, Sweetheart!";
                        modalMessage.textContent = `You left off on Question ${currentQuestionIndex + 1}. Click below to resume your compliment quest!`;
                    } else if (currentQuestionIndex === totalQuestions) {
                        // Already finished, show letter immediately
                        showLoveLetter();
                        welcomeModal.classList.add('hidden');
                        return; // Stop initialization
                    }
                }
            } catch (error) {
                console.error("Could not load progress:", error);
                localStorage.removeItem('quizProgress');
            }
            updateScoreboard();
            updateNavigationButtons(); // Ensure buttons are set correctly on load
        }

        // --- Core Quiz Logic ---

        function updateScoreboard() {
            const filledHearts = '❤️'.repeat(score);
            const emptyHearts = '🤍'.repeat(totalQuestions - score);
            heartScore.innerHTML = `<span class="text-red-500">${filledHearts}</span>${emptyHearts}`;
            
            if (score === totalQuestions) {
                scoreboard.classList.remove('bg-indigo-600');
                scoreboard.classList.add('bg-yellow-400', 'animate-pulse');
            } else {
                 scoreboard.classList.add('bg-indigo-600');
                 scoreboard.classList.remove('bg-yellow-400', 'animate-pulse');
            }
        }

        function updateNavigationButtons() {
            // "Previous" button logic
            if (resultPanel.classList.contains('hidden') || score === 0) {
                prevBtn.disabled = true;
                prevBtn.classList.remove('bg-indigo-600', 'hover:bg-indigo-700');
                prevBtn.classList.add('bg-gray-400', 'hover:bg-gray-500');
            } else {
                // If the panel is visible, we can potentially go back.
                // It shows the compliment for the last SUCCESSFULLY answered question (which is index score - 1)
                // However, while answering the quiz, we use currentQuestionIndex.
                
                // Let's use a simple condition: allow back only if score > 1 OR we are viewing a past question
                const isViewingPastCompliment = nextBtn.disabled; // If next is disabled, we're viewing past.
                
                if (score > 1 || isViewingPastCompliment) {
                     prevBtn.disabled = false;
                     prevBtn.classList.add('bg-indigo-600', 'hover:bg-indigo-700');
                     prevBtn.classList.remove('bg-gray-400', 'hover:bg-gray-500');
                } else {
                     prevBtn.disabled = true;
                     prevBtn.classList.remove('bg-indigo-600', 'hover:bg-indigo-700');
                     prevBtn.classList.add('bg-gray-400', 'hover:bg-gray-500');
                }
            }
            
            // Re-apply disabled state styles based on the actual disabled property
            if (prevBtn.disabled) {
                prevBtn.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                prevBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        function loadQuestion(index) {
            questionPanel.classList.remove('hidden');
            resultPanel.classList.add('hidden');
            userAnswer.value = '';
            
            if (index < totalQuestions) {
                questionText.textContent = questions[index].q;
                submitBtn.disabled = false;
            }
            updateNavigationButtons();
        }

        function startQuiz() {
            if (Tone.context.state !== 'running') {
                Tone.start();
            }

            welcomeModal.style.opacity = '0';
            setTimeout(() => {
                welcomeModal.classList.add('hidden');
            }, 500);

            createConfetti(50);
            createFloatingHeart(10); 

            loadQuestion(currentQuestionIndex);
        }

        function submitAnswer() {
            // The score only increases if the current index hasn't been completed yet.
            if (score === currentQuestionIndex) {
                 score++;
            }
            
            updateScoreboard();
            showResult(questions[currentQuestionIndex]);
            submitBtn.disabled = true;

            createConfetti(15);
            createFloatingHeart();
            playComplimentChime();
            
            if (currentQuestionIndex === totalQuestions - 1) {
                nextBtn.textContent = "A Letter for YOU!";
            } else {
                nextBtn.textContent = "Next Compliment";
            }
            
            saveProgress(); 
        }

        function showResult(data) {
            questionPanel.classList.add('hidden');
            resultPanel.classList.remove('hidden');
            complimentText.textContent = data.compliment;
            memeImage.src = data.memeUrl;
            updateNavigationButtons();
        }
        
        function showPreviousCompliment() {
            // The index of the compliment currently being viewed (or the last one completed)
            let complimentIndex = currentQuestionIndex;
            if (resultPanel.classList.contains('hidden')) {
                // If we are currently on the question screen, the last completed one is score - 1
                 complimentIndex = score - 1; 
            }
            
            if (complimentIndex > 0) {
                complimentIndex--;
                showResult(questions[complimentIndex]);
                
                // When navigating back, disable "Next Compliment" and change its text to "Return to Quiz"
                nextBtn.disabled = true;
                nextBtn.textContent = "Return to Quiz";
                nextBtn.onclick = () => {
                    // This function sends the user back to the *current* question they need to answer
                    // or the love letter if they finished.
                    if (currentQuestionIndex === totalQuestions) {
                        showLoveLetter();
                    } else {
                        loadQuestion(currentQuestionIndex);
                    }
                    nextBtn.disabled = false;
                    nextBtn.onclick = goToNextPhase; 
                };
            }
            updateNavigationButtons();
        }


        function goToNextPhase() {
            // Handle the transition to the love letter
            if (currentQuestionIndex === totalQuestions - 1) {
                currentQuestionIndex++; 
                saveProgress(); 

                // GRAND FINALE SUPER BLAST
                createConfetti(150);
                createFloatingHeart(30);
                
                setTimeout(() => {
                    showLoveLetter();
                    localStorage.removeItem('quizProgress'); // Clear progress after finishing
                }, 1200);

            } else if (currentQuestionIndex < totalQuestions - 1) {
                // Normal progression to the next question
                currentQuestionIndex++;
                loadQuestion(currentQuestionIndex);
                saveProgress(); 
            }
        }

        function showLoveLetter() {
            questionPanel.classList.add('hidden');
            resultPanel.classList.add('hidden');
            loveLetterPanel.classList.remove('hidden');
            loveLetterContent.textContent = finalLetter;
        }

        // --- Aesthetic Effects ---

        function createConfetti(count) {
            const colors = ['var(--pink-accent)', 'var(--red-heart)', 'var(--green)', 'var(--peach)'];
            for (let i = 0; i < count; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = `${Math.random() * 100}vw`;
                confetti.style.top = `${-5}px`;
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = `${2 + Math.random() * 2}s`;
                document.body.appendChild(confetti);

                setTimeout(() => {
                    confetti.remove();
                }, 4000);
            }
        }

        function createFloatingHeart(count = 1) {
            for(let i=0; i < count; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart-float';
                heart.innerHTML = '💖';
                heart.style.left = `${Math.random() * 80 + 10}vw`; 
                heart.style.bottom = '0';
                heart.style.fontSize = `${30 + Math.random() * 20}px`;
                heart.style.animationDuration = `${5 + Math.random() * 3}s`;
                document.body.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 8000);
            }
        }

        // Initialize the app: Check for saved progress first.
        window.onload = function() {
            loadProgress();
        };
    </script>
</body>
</html>
